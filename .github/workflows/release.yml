name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Create release asset
        run: |
          mkdir release
          # Create a single generic archive for all platforms
          # This works because Bash scripts/Markdown are platform-independent
          tar -cvzf release/ralph.tar.gz --exclude='.git*' --exclude='.github*' .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: release/ralph.tar.gz
          generate_release_notes: true
